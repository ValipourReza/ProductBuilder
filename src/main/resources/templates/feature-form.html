<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feature جدید | ProductBuilder</title><link rel="stylesheet" href="/css/app.css"></head>
<body><header class="topbar"><a class="brand" href="/dashboard">ProductBuilder</a><nav><a href="/dashboard">داشبورد</a><a href="/products">محصولات</a><a class="active" href="/features">کاتالوگ Feature</a></nav></header><main class="container narrow"><div class="crumb"><a href="/features">کاتالوگ Feature</a><span>←</span><b>Feature جدید</b></div><section class="panel form-card"><div class="panel-head"><div><span class="eyebrow">REUSABLE COMPONENT</span><h1>تعریف Feature</h1><p>این Feature بعداً می‌تواند در چند محصول استفاده شود.</p></div></div><form method="post" action="/features" class="form-grid"><label><span>کد Feature *</span><input name="code" required maxlength="100" placeholder="INTEREST_RATE"></label><label><span>نام Feature *</span><input name="name" required maxlength="200" placeholder="نرخ سود"></label><label><span>نوع داده *</span><select name="type" required><option th:each="t:${types}" th:value="${t}" th:text="${t}"></option></select></label><label><span>واحد پیشنهادی</span><input name="unit" placeholder="درصد، ریال، ماه"></label><label class="full"><span>توضیحات</span><textarea name="description" rows="4" placeholder="کاربرد و معنای این Feature را توضیح دهید"></textarea></label><div class="form-actions full"><a class="btn" href="/features">انصراف</a><button class="btn primary" type="submit">ثبت Feature</button></div></form></section></main></body></html>
