<!DOCTYPE html><html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versions | ProductBuilder</title><link rel="stylesheet" href="/css/app.css"></head><body><header class="topbar"><a class="brand" href="/dashboard"><span class="brand-mark">PB</span><span>ProductBuilder</span></a><nav><a href="/dashboard">داشبورد</a><a class="active" href="/products">محصولات</a><a href="/features">Feature Catalog</a></nav></header><main class="container"><div class="crumb"><a th:href="@{'/products/'+${product.id}}">Builder</a><span>←</span><b>نسخه‌ها</b></div><section class="hero"><div><span class="eyebrow">VERSION MANAGEMENT</span><h1 th:text="${product.name}"></h1><p>نسخه‌های قابل انتشار محصول را مدیریت کنید. هر تغییر مهم می‌تواند یک نسخه مستقل داشته باشد.</p></div><form method="post" th:action="@{'/products/'+${product.id}+'/versions'}"><button class="btn primary">+ ایجاد نسخه Draft</button></form></section><section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Product Versions</h2><p>Draft → Active/Published</p></div><span class="count" th:text="${versions.size()}">0</span></div><div class="table-wrap"><table><thead><tr><th>Version</th><th>وضعیت</th><th>ایجاد</th><th>انتشار</th><th>عملیات</th></tr></thead><tbody><tr th:each="v:${versions}"><td><strong th:text="'v'+${v.version}+'.0'"></strong></td><td><span class="status" th:classappend="${v.status.name()=='ACTIVE'}?'status-active':'status-draft'" th:text="${v.status}"></span></td><td th:text="${#temporals.format(v.createdAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${v.publishedAt != null ? #temporals.format(v.publishedAt,'yyyy-MM-dd HH:mm') : '—'}"></td><td><form th:if="${v.status.name()!='ACTIVE'}" method="post" th:action="@{'/products/'+${product.id}+'/versions/'+${v.id}+'/publish'}"><button class="btn primary">انتشار</button></form><span th:if="${v.status.name()=='ACTIVE'}" class="chip chip-success">نسخه جاری</span></td></tr><tr th:if="${#lists.isEmpty(versions)}"><td colspan="5" class="empty">هنوز نسخه‌ای ایجاد نشده است.</td></tr></tbody></table></div></section></main></body></html>
