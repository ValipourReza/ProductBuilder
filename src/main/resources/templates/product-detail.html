<!DOCTYPE html><html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title th:text="${product.name}"></title><link rel="stylesheet" href="/css/app.css"></head><body><nav><b>Product Builder</b><a href="/products">محصولات</a><a href="/features">Feature ها</a></nav><main><div class="header"><div><span class="code" th:text="${product.code}"></span><h1 th:text="${product.name}"></h1><p th:text="${product.description}"></p></div></div><section><h2>Feature های محصول</h2><table><thead><tr><th>کد</th><th>نام</th><th>نوع</th><th>اجباری</th><th>مقدار پیش‌فرض</th><th></th></tr></thead><tbody><tr th:each="pf:${product.features}"><td th:text="${pf.feature.code}"></td><td th:text="${pf.feature.name}"></td><td th:text="${pf.feature.type}"></td><td th:text="${pf.requiredField?'بله':'خیر'}"></td><td th:text="${pf.defaultValue}"></td><td><form method="post" th:action="@{'/products/'+${product.id}+'/features/'+${pf.id}+'/delete'}"><button class="danger">حذف</button></form></td></tr></tbody></table></section><section class="builder"><h2>افزودن Feature</h2><form method="post" th:action="@{'/products/'+${product.id}+'/features'}"><label>Feature<select name="featureId" required><option th:each="f:${features}" th:value="${f.id}" th:text="${f.name+' ('+f.code+')'}"></option></select></label><label>ترتیب<input type="number" name="displayOrder" value="0"></label><label>مقدار پیش‌فرض<input name="defaultValue"></label><label class="check"><input type="checkbox" name="required" value="true"> اجباری</label><button class="btn">افزودن به محصول</button></form></section></main></body></html>
