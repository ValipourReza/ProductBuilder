<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feature Catalog | ProductBuilder</title><link rel="stylesheet" href="/css/app.css"></head>
<body><header class="topbar"><a class="brand" href="/dashboard">ProductBuilder</a><nav><a href="/dashboard">داشبورد</a><a href="/products">محصولات</a><a class="active" href="/features">کاتالوگ Feature</a></nav></header><main class="container"><section class="hero"><div><span class="eyebrow">FEATURE CATALOG</span><h1>کاتالوگ Feature</h1><p>Featureها پارامترها و قابلیت‌های استانداردی هستند که در چند محصول قابل استفاده مجددند.</p></div><a class="btn primary" href="/features/new">+ Feature جدید</a></section><div class="toolbar"><div class="search">⌕ <input id="featureSearch" placeholder="جستجوی Feature، کد یا نوع..."></div><span class="result-count" th:text="${features.size()} + ' Feature'"></span></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>کد</th><th>نام</th><th>نوع داده</th><th>توضیحات</th><th>وضعیت</th></tr></thead><tbody><tr th:each="f:${features}" class="feature-row"><td class="code" th:text="${f.code}"></td><td><strong th:text="${f.name}"></strong></td><td><span class="type-pill" th:text="${f.type}"></span></td><td th:text="${f.description ?: '—'}"></td><td><span class="badge" th:classappend="${f.active}?'success':'muted'" th:text="${f.active?'فعال':'غیرفعال'}"></span></td></tr><tr th:if="${#lists.isEmpty(features)}"><td colspan="5" class="empty">هنوز Featureای در کاتالوگ تعریف نشده است.</td></tr></tbody></table></div></section></main><script>const i=document.getElementById('featureSearch');i?.addEventListener('input',()=>{const q=i.value.toLowerCase();document.querySelectorAll('.feature-row').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')});</script></body></html>
